
[functions.delete-account]
enabled = true
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]

[functions.loops-signup]
enabled = true
verify_jwt = false
import_map = "./functions/loops-signup/deno.json"
entrypoint = "./functions/loops-signup/index.ts"

[functions.loops-progress]
enabled = true
verify_jwt = false
import_map = "./functions/loops-progress/deno.json"
entrypoint = "./functions/loops-progress/index.ts"

[functions.backfill-loops-progress]
enabled = true
verify_jwt = false
import_map = "./functions/backfill-loops-progress/deno.json"
entrypoint = "./functions/backfill-loops-progress/index.ts"

# loops-inactive-sweep: daily-scheduled sweep that flips inactive7d /
# inactive14d = true for users whose last_active_at falls between 7-60
# and 14-60 days ago. Scheduled via pg_cron (see the corresponding
# migration). verify_jwt = false because pg_cron authenticates via the
# X-Loops-Webhook-Secret header, same pattern as the sibling Loops
# functions — the Vault entry loops_webhook_secret gates all four.
[functions.loops-inactive-sweep]
enabled = true
verify_jwt = false
import_map = "./functions/loops-inactive-sweep/deno.json"
entrypoint = "./functions/loops-inactive-sweep/index.ts"

# revenuecat-webhook: verify_jwt MUST be false. RevenueCat doesn't send a
# Supabase JWT — it sends a static bearer token that the function verifies
# against REVENUECAT_WEBHOOK_SECRET (see verifyAuth in index.ts). If the
# Supabase gateway's JWT check is left on, every RC request is rejected at
# the edge before the function ever runs — silent in the function logs,
# 100% delivery failure at RC's end.
#
# Missing this block was the cause of the 2026-09-16 outage: the function
# had been deployed with --no-verify-jwt as a CLI flag; a redeploy after
# 2026-09-14 dropped the flag, Supabase defaulted the function to
# verify_jwt = true, and every RC delivery got rejected at the gateway
# for 3 days. Fix: verify_jwt in config wins over the CLI flag, so a
# future redeploy that omits the flag no longer regresses.
#
# No import_map because the function doesn't use one — only index.ts.
[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"
