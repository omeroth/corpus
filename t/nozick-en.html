<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #F0F5FF;
    --plate:   #FDFBF6;
    --rim:     #E5C158;
    --wordmark: #2563EB;
    --name:    #0F2A5C;
    --era:     #6B7FA8;
    --question: #1E3A8A;
    --url:     #B8860B;
  }
  html, body {
    background: var(--bg);
    color: var(--name);
    font-family: 'Rubik', sans-serif;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Nunito', 'Rubik', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--wordmark);
    letter-spacing: -0.7px;
    margin-bottom: 32px;
  }
  .card {
    display: block;
    width: 100%;
    max-width: 640px;
    margin: 0 auto 32px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }
  .redirecting {
    font-weight: 600;
    font-size: 18px;
    color: var(--name);
    margin-bottom: 20px;
    opacity: 0.75;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    background: var(--wordmark);
    color: #FFFFFF;
    transition: transform .15s;
  }
  .cta:active { transform: scale(.97); }
  .url {
    display: block;
    margin-top: 32px;
    color: var(--url);
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <div class="wordmark">Corpus</div>
  <img class="card" src="https://corpusapp.io/share/thinkers/en/nozick.png" alt="Robert Nozick" width="1200" height="630">
  <p class="redirecting">Opening Corpus…</p>
  <a class="cta" id="manual" href="https://apps.apple.com/app/id6781227385">Open Corpus</a>
  <a class="url" href="https://corpusapp.io">corpusapp.io</a>
</main>
<script>
  (function () {
    var POSTHOG_KEY = 'phc_vUupVqSRdBay7mQ4Aswudhu8mFHnych6PKNRpP6BHoS4';
    var POSTHOG_URL = 'https://us.i.posthog.com/i/v0/e/';
    var distinctId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : ('anon-' + Date.now() + '-' + Math.random().toString(36).slice(2));

    var ua = navigator.userAgent || '';
    var isIOS     = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var target     = "https://corpusapp.io";
    var targetKind = 'desktop';
    if (isIOS)          { target = "https://apps.apple.com/app/id6781227385";     targetKind = 'ios'; }
    else if (isAndroid) { target = "https://play.google.com/store/apps/details?id=com.corpusapp.corpus"; targetKind = 'android'; }

    var baseProps = {
      thinker_id: "nozick",
      subject:    "economics",
      lang:       "en",
      target:     targetKind,
      referrer:   document.referrer || null,
      $process_person_profile: false
    };

    function beacon(event, extraProps) {
      var props = extraProps ? Object.assign({}, baseProps, extraProps) : baseProps;
      var payload = {
        api_key:     POSTHOG_KEY,
        event:       event,
        distinct_id: distinctId,
        properties:  props,
        timestamp:   new Date().toISOString()
      };
      try {
        var blob = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
        navigator.sendBeacon(POSTHOG_URL, blob);
      } catch (e) { /* never block the redirect on capture failure */ }
    }

    beacon('thinker_landing_page_view');

    var manual = document.getElementById('manual');
    if (manual) {
      manual.href = target;
      manual.addEventListener('click', function () {
        beacon('thinker_landing_cta_click');
      });
    }

    setTimeout(function () { location.replace(target); }, 250);
  })();
</script>
</body>
