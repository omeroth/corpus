name: Re-engage inactive 1d
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}
jobs:
  reengage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fire inactive1d events
        env:
          POSTHOG_HOST: https://us.posthog.com
          POSTHOG_PROJECT: '388655'
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
        run: node scripts/loops-reengage-3d.mjs --days 1 --window 1 --event-name inactive1d --min-events 3
