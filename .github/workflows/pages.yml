name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # This workflow lives in both omeroth/corpus (source) and omeroth/corpus-app
    # (deploy mirror) because we mirror-push origin/main -> app/main. Skip
    # everywhere except the mirror — where GitHub Pages is enabled — so the
    # source repo's Actions tab stays quiet and no phantom deploys queue there.
    if: ${{ github.repository == 'omeroth/corpus-app' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble deployable site
        run: |
          # Copy ONLY what corpusapp.io serves at runtime. Everything else in
          # the repo (Capacitor iOS/Android sources, design PNGs, Supabase
          # Edge Function code, the www/ mirror, node deps, etc.) is left out
          # so the artifact stays ~12 MB, well below the 1 GB Pages limit.
          # CNAME preserves the custom domain across the source-mode switch.
          mkdir -p _deploy _deploy/app
          # ── SPA at /app/ ──
          # The SPA that was the site. Its repo index.html stays
          # unchanged on disk so `npm run sync-web` keeps feeding
          # Capacitor native the same bytes. Here we deploy it only
          # at /app/, with two targeted substitutions baked in by
          # sed: (a) noindex so Google never ranks the web client
          # against the marketing home, (b) its og:url rewritten to
          # /app/ so social shares don't fight the marketing /
          # canonical.
          sed \
            -e 's#<meta charset="UTF-8">#<meta charset="UTF-8"><meta name="robots" content="noindex,follow">#' \
            -e 's#"https://corpusapp.io/"#"https://corpusapp.io/app/"#g' \
            index.html > _deploy/app/index.html
          # Modified manifest so a PWA install from /app/ keeps its
          # scope there and start_url matches.
          sed \
            -e 's#"start_url": "/"#"start_url": "/app/"#' \
            -e 's#"scope": "/"#"scope": "/app/"#' \
            -e 's#"id": "/"#"id": "/app/"#' \
            manifest.json > _deploy/app/manifest.json
          cp Onboarding_new.html   _deploy/
          cp delete-account.html   _deploy/
          cp manifest.json         _deploy/
          cp CNAME                 _deploy/
          cp version.json          _deploy/
          # SEO assets written by scripts/generate-share-cards.mjs at
          # repo root. Both must reach _deploy or Googlebot can't find
          # the map at corpusapp.io/sitemap.xml.
          if [ -f sitemap.xml ]; then cp sitemap.xml _deploy/; fi
          if [ -f robots.txt  ]; then cp robots.txt  _deploy/; fi
          cp -r assets             _deploy/
          cp -r images             _deploy/
          cp -r content            _deploy/
          # SPA references its assets at ./ relative paths. Mirror
          # them under /app/ too so src="./images/x.webp" from the
          # SPA resolves against /app/images/x.webp at runtime.
          cp -r assets             _deploy/app/
          cp -r images             _deploy/app/
          cp -r content            _deploy/app/
          # ── Marketing site at / ──
          # Four HTML pages + site-assets dir (fonts, chibi, shots,
          # cards, img, store-badges).
          cp    _marketing/index.html       _deploy/
          cp -r _marketing/philosophy       _deploy/
          cp -r _marketing/economics        _deploy/
          cp -r _marketing/psychology       _deploy/
          cp -r _marketing/site-assets      _deploy/
          # Loops email icons — 3 subject folders of 192px PNGs, served at
          # https://corpusapp.io/email-icons/<subject>/<file>.png. Referenced
          # by onbGoalIcon / onbWhoIcon / onbRhythmIcon contact properties on
          # Loops (see supabase/functions/loops-progress/index.ts). Not in
          # sitemap.xml — image-only, nothing for Google to crawl here.
          cp -r _marketing/email-icons      _deploy/
          # Share cards + dialogue landing pages (Part 2 of the share-cards
          # refactor). Generated locally via `npm run gen:share` and committed
          # to the repo so the runner doesn't need node-canvas + TTFs.
          # Skipped silently on the very first push after the refactor lands
          # (before the generator has been run once) so the deploy doesn't
          # break in that transitional window.
          if [ -d share ]; then cp -r share _deploy/; fi
          if [ -d d ];     then cp -r d     _deploy/; fi
          # Thinker landing pages (/t/marx-en.html etc). Committed under t/
          # by the thinker-share-card generator; served at corpusapp.io/t/*.
          if [ -d t ];     then cp -r t     _deploy/; fi
          # Platform-detection redirect served at corpusapp.io/go — routes
          # iOS UAs to the App Store, Android UAs to Play, everything else
          # to the manual-choice buttons. Extensionless URL requires the
          # go/index.html shape (GitHub Pages won't serve bare go.html).
          if [ -d go ];    then cp -r go    _deploy/; fi
          # Static assets referenced by Loops re-engagement emails (bonus
          # unlocked art, etc). Not consumed by the app itself.
          if [ -d email ]; then cp -r email _deploy/; fi
          # Static prototype pages served under /try/<slug>/. Each HTML is
          # self-contained and carries its own <meta name="robots"
          # content="noindex"> (injected once at copy time from
          # /Users/omeroth/corpus-try/*). Not linked from anywhere else
          # on the site and not listed in sitemap.xml — strictly a
          # share-this-URL prototype surface. Guarded so the deploy
          # still succeeds if the directory is ever removed.
          if [ -d try ];   then cp -r try   _deploy/; fi
          echo "--- _deploy summary ---"
          find _deploy -type f | wc -l
          du -sh _deploy

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
