<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corpus כלכלה פרק 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Nunito:wght@800;900&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a shipped Corpus build, warm and playful, one action per screen, nothing decorative that doesn't move the story
IDEA: chapter 1 of philosophy as seven living dialogues: thinkers type, you reply, predict and play
PICTURE: the phone, with the chibi thinkers and hand-built scenes (Plato's cave, the glass prison) as the hero of each screen
COLOUR and TYPE: Corpus purple #2F6FDB on white and lilac, gold rewards, green and red feedback, Nunito plus Caveat Brush for handwriting
LAYOUT: one phone frame on desktop, edge-to-edge app below 520px
*/
:root{color-scheme:light;--p:#2F6FDB;--pd:#1C4FA8;--pl:#EEF4FF;--pl2:#E0EBFF;--ink:#0E2A52;--body:#3B4B63;--mut:#7F93B3;--line:#DDE6F2;--ok:#58CC02;--okd:#46A302;--okbg:#E9FBD9;--okt:#2E7D0F;--no:#E5533D;--nod:#A83A2A;--nobg:#FFF1EE;--not:#B3261E;--gold:#FFC93C;--goldd:#B88A00}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#EEF4FF,#D6E4F8);font:16px/1.5 Rubik,Nunito,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px;overflow-x:clip}
.cap{font-weight:800;color:var(--pd);font-size:14px;margin-bottom:12px;text-align:center}
.cap small{display:block;font-weight:700;color:var(--mut);font-size:13px}
.phone{width:390px;height:820px;max-height:calc(100vh - 80px);min-height:660px;background:#fff;border-radius:48px;box-shadow:0 0 0 11px #0d1626,0 0 0 13px #22345a,0 40px 80px rgba(40,20,90,.35);position:relative;overflow:hidden;isolation:isolate}
@media(max-width:520px){body{padding:0}.cap{display:none}.phone{width:100%;height:100vh;height:100dvh;max-height:none;min-height:0;border-radius:0;box-shadow:none}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.view.enter{animation:vin .42s cubic-bezier(.2,.8,.2,1) both}
.view.leave{animation:vout .3s ease both;pointer-events:none}
@keyframes vin{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes vout{to{transform:translateX(-36px);opacity:0}}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* header */
.top{padding:calc(14px + env(safe-area-inset-top)) 18px 0;flex:none;position:relative;z-index:3;background:inherit}
.bar{display:flex;align-items:center;gap:10px}
.x{width:44px;height:44px;margin-left:-10px;border:0;background:none;font-size:22px;color:#94A6C4;cursor:pointer;border-radius:12px}
.prog{flex:1;height:14px;border-radius:8px;background:#EAF0F8;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#5B8DEB,var(--p));border-radius:8px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:3px;background:rgba(255,255,255,.35)}
.xpill{display:flex;align-items:center;gap:4px;background:#FFF6E0;color:var(--goldd);font-weight:900;font-size:14px;border-radius:999px;padding:4px 10px;min-width:62px;justify-content:center;transition:transform .2s}
.xpill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.sub{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--mut);margin-top:6px;letter-spacing:.3px}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 18px 24px;scroll-behavior:smooth;position:relative}
.foot{flex:none;padding:14px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid #F1EDF8;background:#fff;position:relative;z-index:3}
.view.dark .foot:not(.ok):not(.no){background:#0d1626;border-color:#1a2840}
.foot.ok{background:var(--okbg);border-color:transparent;animation:up .35s cubic-bezier(.2,.9,.3,1.2)}
.foot.no{background:var(--nobg);border-color:transparent;animation:up .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(40px)}}
.fbt{font-weight:900;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fbt .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;margin-right:8px;font-size:16px}
.foot.ok .fbt{color:var(--okt)}.foot.no .fbt{color:var(--not)}
.fbx{font-size:14.5px;line-height:1.45;margin:6px 0 12px}
.foot.ok .fbx{color:#2E5D14}.foot.no .fbx{color:#7A2E22}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:16px;letter-spacing:1px;color:#fff;background:var(--p);box-shadow:0 5px 0 var(--pd);cursor:pointer;min-height:54px;transition:transform .08s,box-shadow .08s,background .2s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--pd)}
.btn[disabled]{background:#EAF0F8;color:#A9B9D6;box-shadow:0 5px 0 #D3DEEE;cursor:default}
.foot.ok .btn{background:var(--ok);box-shadow:0 5px 0 var(--okd)}
.foot.no .btn{background:var(--no);box-shadow:0 5px 0 var(--nod)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--goldd)}
.ghost{display:block;width:100%;margin-top:8px;border:0;background:none;font-weight:800;font-size:15px;color:var(--mut);cursor:pointer;min-height:40px}
/* type */
h2{font-size:23px;line-height:1.22;margin:6px 0 12px;font-weight:900;text-wrap:balance}
h2 em{font-style:normal;color:var(--p)}
h3{font-size:18.5px;line-height:1.3;margin:16px 0 4px;font-weight:900}
p{margin:8px 0;color:var(--body);font-size:16.5px}
.lead{color:var(--p);font-weight:900;font-size:17.5px;margin-top:12px;line-height:1.35}
.tag{display:inline-block;background:var(--pl2);color:var(--p);font-weight:900;font-size:11px;letter-spacing:1.4px;padding:5px 10px;border-radius:8px}
.tag.src{background:#FFF6E0;color:#B8860B}
.note{font-size:12.5px;color:var(--mut);font-weight:700;margin-top:6px}
.fade{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* thinker header */
.th{display:flex;gap:10px;align-items:flex-end;margin:2px 0 12px}
.th .ch{height:104px;flex:none;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.025) scaleX(.99)}}
.bub{flex:1;border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;font-weight:800;font-size:16.5px;line-height:1.35;background:#fff;align-self:center;position:relative;animation:fin .4s .1s ease both}
/* options */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-weight:800;font-size:16px;line-height:1.3;color:var(--ink);margin-top:10px;box-shadow:0 4px 0 var(--line);background:#fff;cursor:pointer;transition:transform .1s,box-shadow .1s,border-color .15s,background .15s;animation:fin .4s ease both}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:13px;color:var(--mut);transition:.15s}
.opt .e{font-size:22px;flex:none}
.opt.sel{border-color:var(--p);background:var(--pl);box-shadow:0 4px 0 var(--p);animation:pick .3s}
.opt.sel .k{border-color:var(--p);color:var(--p)}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 var(--ok);animation:pick .35s}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg);box-shadow:0 4px 0 var(--no);animation:shake .45s}
.opt.no .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
@keyframes pick{40%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.row2{display:flex;gap:10px}.row2 .opt{justify-content:center;text-align:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.ln{display:flex;gap:8px;align-items:flex-end;animation:pop .38s cubic-bezier(.2,.9,.3,1.3) both}
.ln .av{height:52px;flex:none;width:44px;object-fit:contain;object-position:bottom}
.ln .av.hid{visibility:hidden}
.msg{max-width:262px;background:var(--pl);border-radius:20px 20px 20px 6px;padding:10px 14px;font-weight:700;font-size:16px;line-height:1.4;color:var(--ink)}
.ln.me{justify-content:flex-end}
.ln.me .msg{background:var(--p);color:#fff;border-radius:20px 20px 6px 20px}
.who{font-size:11px;font-weight:900;letter-spacing:1.2px;margin:8px 0 -3px 52px;animation:fin .3s both}
.typing{display:inline-flex;gap:5px;padding:14px 16px}
.typing span{width:8px;height:8px;border-radius:50%;background:#8FA8D6;animation:dot 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-6px);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.chip{border:2px solid var(--p);color:var(--p);background:#fff;border-radius:999px;padding:10px 16px;font-weight:900;font-size:15px;cursor:pointer;min-height:44px;box-shadow:0 3px 0 #C6D8F5;animation:pop .35s both}
.chip:active{transform:translateY(2px);box-shadow:none}
.hint{font-size:12px;color:var(--mut);font-weight:800;text-align:center;margin-top:6px}
.cast{display:flex;justify-content:center;gap:14px;margin:12px 0 2px}
.cast div{text-align:center;font-size:12px;font-weight:900;color:var(--body);animation:pop .4s both}
.cast img{height:92px;display:block;margin:0 auto 2px}
.qcard{margin-top:14px;padding-top:14px;border-top:2px dashed var(--line);animation:fin .4s both}
.qcard .q{font-weight:900;font-size:18px;line-height:1.3}
/* cards & blocks */
.sc{border:2px solid var(--line);border-radius:18px;padding:14px;font-size:15.5px;line-height:1.5;color:var(--ink);background:#FBFAFE}
.quote{border-left:5px solid var(--gold);background:#FFFBF0;border-radius:6px 16px 16px 6px;padding:14px 16px;font-style:italic;font-weight:700;font-size:17px;line-height:1.5;margin-top:10px;color:#3a2a10}
.quote .w{opacity:0;animation:fin .35s forwards}
.more{width:100%;margin-top:12px;border:2px dashed #B6CCF0;border-radius:14px;padding:12px 14px;font-weight:900;font-size:15px;color:var(--p);background:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:48px;text-align:left}
.more.open{border-style:solid;border-color:var(--p);background:var(--pl)}
.more .pm{transition:transform .25s}.more.open .pm{transform:rotate(45deg)}
.exp{overflow:hidden;max-height:0;transition:max-height .45s ease}
.exp.open{max-height:600px}
.poll{position:relative;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:800;overflow:hidden}
.poll b{position:absolute;inset:0 auto 0 0;background:var(--pl2);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.poll.me{border-color:var(--p)}.poll.me b{background:#CFE0FF}
.poll span{position:relative;display:flex;justify-content:space-between;gap:8px}
.li{display:flex;gap:12px;align-items:flex-start;font-weight:800;margin-top:12px;animation:fin .45s both}
.li b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:14px}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;border:2px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;font-weight:900;font-size:18px;background:#fff}
.stat small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:1px}
.next{margin-top:16px;border-radius:18px;background:linear-gradient(135deg,var(--ink),var(--pd));color:#fff;padding:14px 15px;display:flex;gap:12px;align-items:center;animation:fin .5s .5s both}
.next img{height:66px}
.next small{display:block;font-size:11px;letter-spacing:1.5px;color:#BFD2F2;font-weight:900}
.flag{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;animation:fin .45s both}
.flag .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.flag b{display:block}.flag span{font-size:14px;color:var(--body)}
/* tiles */
.tile{position:relative;height:58px;margin-top:10px;perspective:700px;cursor:pointer;border:0;background:none;width:100%;padding:0}
.tile .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.tile.on .in{transform:rotateX(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800;font-size:15.5px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.tile .b{transform:rotateX(180deg)}
.tile .b.y{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 var(--ok)}
.tile .b.n{border-color:var(--no);background:var(--nobg);box-shadow:0 4px 0 var(--no)}
/* swipe sort */
.sorter{position:relative;height:214px;margin-top:10px}
.scard{position:absolute;left:50%;top:6px;width:230px;margin-left:-115px;height:120px;border-radius:20px;background:#fff;border:2px solid var(--line);box-shadow:0 10px 24px rgba(20,50,110,.14),0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:18px;text-align:center;padding:10px;transition:transform .45s cubic-bezier(.3,.9,.4,1),opacity .45s}
.scard .em{font-size:34px}
.scard.gl{transform:translate(-150px,70px) rotate(-18deg) scale(.4);opacity:0}
.scard.gr{transform:translate(150px,70px) rotate(18deg) scale(.4);opacity:0}
.scard.in{animation:cin .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cin{from{transform:translateY(-30px) scale(.85);opacity:0}}
.bins{display:flex;gap:10px;position:absolute;left:0;right:0;bottom:0}
.bin{flex:1;border:3px dashed;border-radius:18px;padding:10px 6px;text-align:center;font-weight:900;font-size:13px;letter-spacing:.5px;min-height:64px;cursor:pointer;background:#fff;transition:transform .12s}
.bin:active{transform:scale(.97)}
.bin.l{border-color:#E5533D;color:#C0392B;background:#FFF6F4}.bin.r{border-color:#58A62C;color:#3C7D17;background:#F3FCEC}
.bin .n{font-size:22px;display:block}
.bin.hit{animation:pick .35s}
/* tf */
.big2{display:flex;gap:12px;margin-top:16px}
.big2 .opt{flex:1;justify-content:center;font-size:20px;padding:20px 10px}
.stmt{background:var(--ink);color:#fff;border-radius:20px;padding:18px;text-align:center;font-weight:900;font-size:19px;line-height:1.3}
.stmt small{display:block;font-size:11px;letter-spacing:1.5px;color:#BFD2F2;margin-bottom:6px}
/* glass */
.prison{position:relative;margin-top:8px;padding:16px;border-radius:24px;background:linear-gradient(180deg,#EEF5FF,#F8FBFF);border:3px dashed #B9D4F5}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{position:relative;height:84px;border-radius:14px;border:2px solid #A9C8EE;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(205,225,250,.55));box-shadow:inset 0 0 0 4px rgba(255,255,255,.6),0 4px 0 #C8DBF4;font-weight:900;font-size:14px;color:var(--ink);display:grid;place-items:center;text-align:center;padding:8px;cursor:pointer;overflow:hidden}
.pane::before{content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:rotate(20deg);animation:glint 3.6s infinite}
.pane:nth-child(2)::before{animation-delay:.9s}.pane:nth-child(3)::before{animation-delay:1.8s}.pane:nth-child(4)::before{animation-delay:2.7s}
@keyframes glint{0%,60%{left:-60%}100%{left:130%}}
.pane svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pane svg path{fill:none;stroke:#5A6E8C;stroke-width:1.6;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .5s forwards}
.pane.cr{animation:shake .4s;border-color:var(--p);background:linear-gradient(135deg,#EEF4FF,#E4DCF7)}
@keyframes draw{to{stroke-dashoffset:0}}
.me-fig{text-align:center;margin-top:8px}
.me-fig img{height:86px}
/* faces */
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.face{border:2px solid var(--line);border-radius:16px;background:#fff;padding:8px 4px 6px;text-align:center;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:.15s}
.face img{height:84px;display:block;margin:0 auto 2px}
.face.ok{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 var(--ok);animation:pick .35s}
.face.no{border-color:var(--no);background:var(--nobg);box-shadow:0 4px 0 var(--no);animation:shake .45s}
/* journal */
.paper{background:#FBF3DF;border:2px solid #E3D2A6;border-radius:14px;padding:14px 16px;transform:rotate(-1deg);box-shadow:0 10px 18px rgba(120,90,30,.14);font-family:"Caveat Brush",cursive;color:#5A4520;font-size:22px;line-height:1.3}
.paper small{display:block;font-family:Nunito;font-weight:900;font-size:11px;letter-spacing:1.3px;color:#9A7A3A;margin-bottom:6px}
textarea.jr{width:100%;min-height:92px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:"Caveat Brush",cursive;font-size:22px;color:var(--ink);resize:none;background:#FFFDF7;margin-top:10px}
textarea.jr:focus{outline:none;border-color:var(--p)}
/* scenes */
.scene{position:relative;height:300px;margin:4px -18px 10px;overflow:hidden}
.cave{background:#120a12}
.cave .wall{position:absolute;inset:0 0 110px;background:radial-gradient(60% 80% at 50% 110%,rgba(255,140,40,.35),transparent 70%),radial-gradient(30px 20px at 20% 30%,rgba(255,255,255,.04),transparent),radial-gradient(40px 26px at 75% 22%,rgba(255,255,255,.05),transparent),radial-gradient(50px 30px at 55% 60%,rgba(0,0,0,.25),transparent),linear-gradient(180deg,#24161f,#3a2430 80%,#2a1820);border-bottom:2px solid #1a0f14}
.cave .glow{position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 120%,rgba(255,170,70,.45),transparent 70%);animation:flick 2.2s infinite;mix-blend-mode:screen}
@keyframes flick{0%,100%{opacity:.75}20%{opacity:1}35%{opacity:.6}55%{opacity:.95}75%{opacity:.7}}
.shadows{position:absolute;left:0;right:0;top:34px;height:120px}
.sh{position:absolute;bottom:0;left:0;height:118px;fill:#0a0508;opacity:.85;filter:blur(1.6px);animation:walk 11s linear infinite}
.pup{position:absolute;bottom:118px;left:0;height:40px;fill:#8a5a32;animation:walk 11s linear infinite}
@keyframes walk{from{transform:translateX(-140px)}to{transform:translateX(440px)}}
.sh.b,.pup.b{animation-delay:-3.7s}.sh.c,.pup.c{animation-delay:-7.4s}
.parapet{position:absolute;left:0;right:0;bottom:92px;height:28px;background:linear-gradient(180deg,#3b2618,#24160d);box-shadow:0 -2px 0 #4e321e}
.cave .floor{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(180deg,#1d1009,#0c0604)}
.pris{position:absolute;bottom:108px;display:flex;gap:8px;left:50%;transform:translateX(-50%);z-index:2}
.pris img{height:78px;filter:brightness(0);opacity:.92}
.pris .you{position:relative}
.pris .you::after{content:"אתם";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font:900 11px Nunito;letter-spacing:1px;color:#FFC93C;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:999px}
.pris .free{filter:none;opacity:1}
.fire{position:absolute;bottom:14px;left:50%;width:90px;height:80px;margin-left:-45px;z-index:3}
.fire i{position:absolute;bottom:8px;left:50%;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;transform-origin:50% 100%;filter:blur(2px);mix-blend-mode:screen}

.lay{position:absolute;z-index:4;right:12px;display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.6);background:rgba(10,30,55,.55);color:#fff;border-radius:999px;padding:6px 12px 6px 10px;font-weight:900;font-size:13px;cursor:pointer;backdrop-filter:blur(2px)}
.lay.l0{top:40px;background:rgba(255,255,255,.85);color:var(--ink);border-color:#fff}.lay.l1{top:130px}.lay.l2{top:250px}
.lay.nx{box-shadow:0 0 0 0 rgba(255,201,60,.8);animation:pulse2 1.4s infinite;border-color:var(--gold)}
.lay.on{background:var(--gold);color:var(--ink);border-color:var(--gold);animation:pop .3s}
@keyframes pulse2{70%{box-shadow:0 0 0 12px rgba(255,201,60,0)}100%{box-shadow:0 0 0 0 rgba(255,201,60,0)}}
.feed{position:relative;margin:12px auto 6px;width:220px;height:300px;border-radius:30px;background:#111;padding:10px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.fv{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden}
.vid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px;transition:transform .35s cubic-bezier(.3,.9,.4,1),opacity .35s}
.vid.in{animation:vup .35s cubic-bezier(.3,.9,.4,1)}.vid.out{transform:translateY(-100%);opacity:.4}
@keyframes vup{from{transform:translateY(100%)}}
.ve{font-size:64px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}.vt{font-weight:900;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.vid.win .ve{animation:bump .5s .2s}.like{position:absolute;bottom:14px;left:14px;font:900 14px Nunito;background:rgba(0,0,0,.3);border-radius:999px;padding:4px 10px;animation:pop .4s .15s both}
.swipe{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:var(--p);color:#fff;font-weight:900;font-size:16px;padding:12px 26px;box-shadow:0 5px 0 var(--pd);cursor:pointer}
.swipe:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 var(--pd)}.swipe:disabled{background:#B3A79C;box-shadow:0 5px 0 #8f857c}
.fstat{display:flex;justify-content:center;gap:18px;margin-top:34px;font-weight:800;color:var(--body)}.fstat b{color:var(--p)}
.mstage{position:relative;height:150px;margin-top:10px}
.mcard{position:absolute;left:50%;top:4px;width:250px;margin-left:-125px;min-height:126px;border-radius:20px;background:#fff;border:2px solid var(--line);box-shadow:0 10px 24px rgba(120,60,20,.14),0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px;transition:transform .35s,opacity .35s}
.mcard .em{font-size:34px}.mcard b{font-size:18px;color:var(--ink)}.mcard small{color:var(--body);font-weight:700;font-size:13.5px;line-height:1.3}
.mcard.in{animation:cin .4s cubic-bezier(.2,.9,.3,1.3)}.mcard.gone{transform:translateY(60px) scale(.4);opacity:0}
.mbins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbin{border:3px dashed var(--p);border-radius:16px;background:var(--pl);color:var(--pd);font-weight:900;font-size:14px;min-height:58px;cursor:pointer}.mbin.hit{animation:pick .35s}
</style>

/* ---------------- shell ---------------- */
let view=null, D=null, step=0, dayScore=0, dayQ=0, dayXP=0;
function mount(html,cls=''){
  const old=view; const el=document.createElement('div'); el.className='view enter '+cls; el.innerHTML=html; phone.appendChild(el); view=el;
  if(old){old.classList.add('leave');setTimeout(()=>old.remove(),320)}
  return el;
}
function header(label){
  const n=D.steps.length;
  return `<div class="top"><div class="bar"><button class="x" data-x aria-label="סגירה">✕</button><div class="prog"><i style="width:${Math.round(step/n*100)}%"></i></div><div class="xpill" data-xp dir="ltr">⭐ ${G.xp}</div></div><div class="sub"><span>${label||('שלב '+(step+1)+' מתוך '+n)}</span><span>${D.who}</span></div></div>`;
}
function screen(label,body,cls){
  const el=mount(header(label)+`<div class="main">${body}</div><div class="foot"></div>`,cls);
  $('[data-x]',el).onclick=()=>{$('#mimg').src=IMG[D.home];$('#modal').classList.add('on')};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=$('.prog i',el);if(i)i.style.width=Math.round((step+1)/D.steps.length*100)+'%'}));
  const main=$('.main',el);
  main.addEventListener('click',()=>{SPEED=.25;clearTimeout(main._sp);main._sp=setTimeout(()=>SPEED=1,1500)});
  return {el,main,foot:$('.foot',el)};
}
function th(img,text){return `<div class="th"><img class="ch" src="${IMG[img]}" alt=""><div class="bub">${text}</div></div>`}
function setFoot(foot,label,on,fn,extra=''){
  foot.className='foot';foot.innerHTML=extra+`<button class="btn" ${on?'':'disabled'}>${label}</button>`;
  const b=$('.btn',foot);b.onclick=fn||nextStep;return b;
}
function fill(s){return s.replace(/\{\{([\w-]+)\}\}/g,(m,k)=>IMG[k]||'')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)}
function burst(target,colors=['#58CC02','#FFC93C','#2F6FDB','#2E7CE2','#FF6B9E']){
  const r=target.getBoundingClientRect(),p=phone.getBoundingClientRect();
  for(let i=0;i<16;i++){const d=document.createElement('i');d.className='burst';const a=Math.random()*Math.PI*2,dist=50+Math.random()*60;
   d.style.cssText=`left:${r.left-p.left+r.width*(.2+Math.random()*.6)}px;top:${r.top-p.top+r.height/2}px;background:${colors[i%colors.length]};--x:${Math.cos(a)*dist}px;--y:${Math.sin(a)*dist-20}px;--r:${Math.random()*360}deg`;
   phone.appendChild(d);setTimeout(()=>d.remove(),900)}
}
function flyXP(from,amt){
  const pill=$('[data-xp]',view);if(!pill)return;
  const r=from.getBoundingClientRect(),p=phone.getBoundingClientRect(),t=pill.getBoundingClientRect();
  const f=document.createElement('div');f.className='fly';f.dir='ltr';f.textContent='+'+amt+' XP';
  f.style.left=(r.right-p.left-80)+'px';f.style.top=(r.top-p.top)+'px';phone.appendChild(f);
  requestAnimationFrame(()=>{f.style.transform=`translate(${t.left-r.right+80}px,${t.top-r.top}px) scale(.6)`;f.style.opacity='.2'});
  setTimeout(()=>{f.remove();G.xp+=amt;dayXP+=amt;pill.textContent='⭐ '+G.xp;pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump')},800);
}
function confetti(n=60){
  const cs=['#FFC93C','#2F6FDB','#58CC02','#FF6B9E','#2E7CE2','#fff'];
  for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.cssText=`left:${Math.random()*100}%;background:${cs[i%cs.length]};--x:${(Math.random()-.5)*160}px;--r:${Math.random()*900}deg;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s;border-radius:${Math.random()>.5?'50%':'2px'}`;phone.appendChild(c);setTimeout(()=>c.remove(),3800)}
}
// graded question: buttons array, correct index; returns promise
function grade(btns,c,q,foot,onDone){
  let tries=0;const second=btns.length>2;
  btns.forEach((b,i)=>b.onclick=()=>{
    if(b.disabled)return;const ok=i===c;tries++;
    if(!ok&&second&&tries===1){b.disabled=true;b.classList.add('no');b.style.animation='shake .45s';
      foot.className='foot no';foot.innerHTML='<div class="fbt"><span><span class="ic">🔁</span>לא בדיוק. נסו שוב</span></div><button class="btn" disabled>בחרו תשובה אחרת</button>';return}
    btns.forEach((x,j)=>{x.disabled=true;if(j===c)x.classList.add('ok');else if(j===i)x.classList.add('no');else if(!x.classList.contains('no'))x.classList.add('dim')});
    dayQ++;if(ok){if(tries===1)dayScore++;burst(b);flyXP(b,tries===1?15:5)}
    feedback(foot,ok,ok?(tries===1?q.good[0]:'נכון, בניסיון השני'):'לא בדיוק',ok?q.good[1]:q.bad,onDone);
    if(ok&&tries>1){const x=$('.xpill',foot);if(x)x.textContent='+5 XP'}
  });
}
function prevStep(){if(!D)return;step=Math.max(0,step-1);render()}
function ensureBack(){$$('.view:not(.leave) .foot').forEach(f=>{const v=f.closest('.view');if(!D||!v.querySelector('.top')||f.querySelector('.back'))return;const b=f.querySelector('.btn');if(!b)return;
  const row=document.createElement('div');row.className='frow';b.before(row);const bk=document.createElement('button');bk.className='back';bk.setAttribute('aria-label','חזרה');bk.textContent='→';bk.onclick=prevStep;if(step===0)bk.style.display='none';row.append(bk,b)})}
new MutationObserver(()=>ensureBack()).observe(document.getElementById('phone'),{childList:true,subtree:true});
function feedback(foot,ok,title,text,fn){
  foot.className='foot '+(ok?'ok':'no');
  foot.innerHTML=`<div class="fbt"><span><span class="ic">${ok?'✅':'💡'}</span>${title}</span>${ok?'<span class="xpill" dir="ltr">+15 XP</span>':''}</div><div class="fbx">${text}</div><button class="btn">המשך</button>`;
  $('.btn',foot).onclick=fn||nextStep;
}
function optHTML(list,abc,start=0){return list.map((o,i)=>`<button class="opt" style="animation-delay:${(start+i)*70}ms" data-i="${i}">${abc?`<span class="k">${'אבגד'[i]}</span><span>${o}</span>`:`<span class="e">${o[0]}</span><span>${o[1]}</span>`}</button>`).join('')}
function quoteHTML(t){return '"'+t.split(' ').map((w,i)=>`<span class="w" style="animation-delay:${i*28}ms">${w}</span>`).join(' ')+'"'}
function moreHTML(m,open){return `<button class="more ${open?'open':''}" data-more><span>${m[0]}</span><span class="pm">＋</span></button><div class="exp ${open?'open':''}"><p style="font-size:15px">${m[1]}</p></div>`}
function bindMore(el){$$('[data-more]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();b.classList.toggle('open');b.nextElementSibling.classList.toggle('open');setTimeout(()=>b.scrollIntoView({block:'nearest',behavior:'smooth'}),200)})}

/* ---------------- chat engine ---------------- */
async function runChat(main,box,foot,script,done){
  let last=null;
  const scroll=()=>main.scrollTo({top:main.scrollHeight,behavior:'smooth'});
  const bubble=async(sp,text,img)=>{
    const c=CH[sp];const showWho=last!==sp;last=sp;
    if(showWho)box.insertAdjacentHTML('beforeend',`<div class="who" style="color:${c.c}">${c.n}</div>`);
    const ln=document.createElement('div');ln.className='ln';
    ln.innerHTML=`<img class="av" src="${IMG[img||c.i]}" alt=""><div class="msg" style="background:${c.bg}"><span class="typing"><span></span><span></span><span></span></span></div>`;
    box.appendChild(ln);scroll();
    await wait(Math.min(2800,Math.max(1300,800+text.length*22)));
    const m=$('.msg',ln);m.style.animation='pop .3s both';m.innerHTML=text;scroll();
    await wait(380);
  };
  const run=async items=>{
    for(const it of items){
      if(it.s) await bubble(it.s,it.t,it.i);
      else if(it.me){last='me';box.insertAdjacentHTML('beforeend',`<div class="ln me"><div class="msg">${esc(it.me)}</div></div>`);scroll();await wait(650)}
      else if(it.sys){box.insertAdjacentHTML('beforeend',`<div class="hint fade" style="margin:8px 0">${it.sys}</div>`);scroll();await wait(800)}
      else if(it.paper){box.insertAdjacentHTML('beforeend',`<div class="paper fade" style="margin:10px 6px"><small>${it.paper[0]}</small>${it.paper[1]}</div>`);scroll();await wait(900)}
      else if(it.reply){
        const wrap=document.createElement('div');wrap.className='chips';
        wrap.innerHTML=it.reply.map((r,i)=>`<button class="chip" style="animation-delay:${i*80}ms">${esc(r)}</button>`).join('');
        box.appendChild(wrap);box.insertAdjacentHTML('beforeend','<div class="hint" data-h>בחרו תגובה</div>');scroll();
        const i=await new Promise(res=>$$('.chip',wrap).forEach((b,j)=>b.onclick=()=>res(j)));
        wrap.remove();$('[data-h]',box)?.remove();
        if(it.key){A[it.key]=it.reply[i]}
        last='me';box.insertAdjacentHTML('beforeend',`<div class="ln me"><div class="msg">${esc(it.reply[i])}</div></div>`);scroll();await wait(500);
        if(it.then&&it.then[i]) await run(it.then[i]);
      }
      else if(it.quiz){
        const q=it.quiz;const qc=document.createElement('div');qc.className='qcard';
        qc.innerHTML=`<div class="q">${q.q}</div>`+optHTML(q.opts,true);box.appendChild(qc);scroll();
        foot.innerHTML='<button class="btn" disabled>בחרו תשובה</button>';
        grade($$('.opt',qc),q.c,q,foot);return 'quiz';
      }
    }
  };
  const r=await run(script);
  if(r!=='quiz')done();
}

},
match(s){
  const {main,foot}=screen(s.label,th(s.img,s.say)+`<div class="mstage"><div data-card></div></div><div class="mbins">${s.bins.map((x,i)=>`<button class="mbin" data-b="${i}">${x}</button>`).join('')}</div><div class="hint" data-hint>הקישו על הארכיטיפ המתאים</div><div data-done></div>`);
  foot.innerHTML=`<button class="btn" disabled>התאימו את כל ה-${s.items.length}</button>`;
  let k=0;const show=()=>{const it=s.items[k];$('[data-card]',main).innerHTML=`<div class="mcard in"><span class="em">${it[0]}</span><b>${it[1]}</b><small>${it[2]}</small></div>`};show();
  $$('.mbin',main).forEach(bn=>bn.onclick=e=>{e.stopPropagation();if(k>=s.items.length||main._b)return;const it=s.items[k],pick=+bn.dataset.b,card=$('.mcard',main);
    if(pick!==it[3]){card.style.animation='shake .45s';setTimeout(()=>card.style.animation='',460);toast('לא בדיוק. נסו שוב');return}
    main._b=1;setTimeout(()=>main._b=0,400);card.classList.add('gone');bn.classList.remove('hit');void bn.offsetWidth;bn.classList.add('hit');
    $('[data-done]',main).insertAdjacentHTML('beforeend',`<div class="li fade"><b>${it[0]}</b><div>${it[1]} · <span style="color:var(--p)">${s.bins[pick]}</span></div></div>`);k++;
    setTimeout(()=>{if(k<s.items.length)show();else{$('[data-card]',main).innerHTML='<div class="mcard in" style="border-color:var(--ok)"><span class="em">🗺️</span><b>המסע של הגיבור</b></div>';$('[data-hint]',main).remove();dayQ++;dayScore++;
      foot.className='foot ok';foot.innerHTML=`<div class="fbt"><span><span class="ic">✅</span>${s.items.length} מתוך ${s.items.length}</span><span class="xpill" dir="ltr">+15 XP</span></div><button class="btn">המשך</button>`;$('[data-done]',main).insertAdjacentHTML('beforeend',`<div class="rpx fade">${s.after}</div>`);$('.btn',foot).onclick=nextStep;setTimeout(()=>main.scrollTo({top:main.scrollHeight,behavior:'smooth'}),100);burst($('.mcard',main));flyXP($('.mcard',main),15)}},380)});
},
intro(s){
  const T=[['samuelson-curious','סמואלסון'],['smith-curious','סמית'],['marx-curious','מרקס'],['keynes-curious','קיינס'],['friedman-curious','פרידמן'],['sen-curious','סן']];
  const el=mount(`<div class="main" style="padding-top:calc(30px + env(safe-area-inset-top));text-align:center;color:#fff"><div style="color:var(--gold);font-weight:900;letter-spacing:2px;font-size:14px">סיום פרק 1</div><h2 style="font-size:32px;color:#fff;margin:10px 0">6 הוגים.<br>6 ימים.<br>מבחן אחד.</h2>
   <div style="display:flex;justify-content:center;align-items:flex-end;margin-top:14px">${T.map((t,i)=>`<div style="animation:pop .45s ${i*120}ms both;width:58px;font-size:11px;font-weight:800;color:#DCE8FB"><img src="${IMG[t[0]]}" style="height:84px;display:block;margin:0 auto" alt="">${t[1]}</div>`).join('')}</div>
   <div style="background:rgba(255,255,255,.1);border-radius:18px;padding:16px;margin-top:22px"><b>מי מהם הכי נשאר איתכם?</b><div class="chips" style="justify-content:center">${T.map(t=>`<button class="chip" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4);box-shadow:none">${t[1]}</button>`).join('')}</div></div></div>
   <div class="foot" style="background:transparent;border:0"><button class="btn gold" disabled>בחרו אחד</button></div>`,'reward');
  const b=$('.btn',el);
  $$('.chip',el).forEach(c=>c.onclick=()=>{$$('.chip',el).forEach(x=>{x.style.background='transparent';x.style.color='#fff'});c.style.background='var(--gold)';c.style.color='var(--ink)';A.fav=c.textContent;b.disabled=false;b.textContent='למבחן הסיום'});
  b.onclick=nextStep;
},
faces(s){
  const {main,foot}=screen(s.label,`<div class="sc fade">${s.scen}</div><h2 style="font-size:20px;margin-top:14px">${s.q}</h2><div class="faces">${s.faces.map(f=>`<button class="face"><img src="${IMG[f[0]]}" alt="">${f[1]}</button>`).join('')}</div>`);
  foot.innerHTML='<button class="btn" disabled>בחרו הוגה</button>';
  const fs=$$('.face',main);
  fs.forEach((f,i)=>f.onclick=()=>{if(f.disabled)return;const ok=i===s.c;fs.forEach((x,j)=>{x.disabled=true;if(j===s.c)x.classList.add('ok');else if(j===i)x.classList.add('no');else x.style.opacity=.5});dayQ++;if(ok){dayScore++;burst(f);flyXP(f,15)}feedback(foot,ok,ok?s.good[0]:'לא בדיוק',ok?s.good[1]:s.bad)});
},
week(){
  const rows=[['💸','יום 1 · הבעיה הכלכלית שלכם',A.scar?A.scar[1]:'…'],['🥖','יום 2 · מי דואג ללחם',A.bread?A.bread[1]:'…'],['⏳','יום 3 · כמה זמן תחזיקו בלי משכורת',A.wait?A.wait[1]:'…'],['🐷','יום 4 · כשאתם חוששים מהעתיד',A.fear?A.fear[1]:'…'],['🗽','יום 5 · מי מחליט על העבודה שלכם',A.job?A.job[1]:'…'],['🍚','יום 6 · הסיבה לרעב, לדעתכם',A.famine?A.famine[1]:'…']];
  const {main,foot}=screen('השבוע שלכם',th('samuelson-curious','תראו מה גיליתם על הכלכלה שלכם השבוע.')+`<span class="tag">הכלכלה שלכם, עד עכשיו</span>`+rows.map((r,i)=>`<div class="flag" style="animation-delay:${i*120}ms;padding:9px 12px"><div class="dot" style="background:var(--pl);width:40px;height:40px">${r[0]}</div><div><span style="font-size:11px;font-weight:900;color:var(--mut);letter-spacing:.5px">${r[1]}</span><b>${esc(r[2])}</b></div></div>`).join('')+`<div class="note">שחקו בימים 1 עד 6 כדי למלא את כל השורות.</div>`);
  setFoot(foot,'לסיכום הפרק',true);
},
complete(){
  G.done.add(6);
  const cards=['card-samuelson','card-smith','card-marx','card-keynes','card-friedman','card-sen'];
  const el=mount(`<div class="main" style="padding-top:calc(30px + env(safe-area-inset-top));text-align:center;color:#fff"><div style="color:var(--gold);font-weight:900;letter-spacing:2px;font-size:14px">פרק 1 הושלם 📈</div><h2 style="color:#fff;font-size:30px;margin:6px 0">מה זאת בכלל כלכלה?</h2>
   <div class="fan">${cards.map((c,i)=>`<img src="${IMG[c]}" alt="" style="--r:${(i-2.5)*11}deg;--x:${(i-2.5)*8}px;animation-delay:${.2+i*.15}s;z-index:${i}">`).join('')}</div>
   <div class="stats"><div class="stat">🎯 ${dayScore}/${dayQ}<small>מבחן הסיום</small></div><div class="stat">⭐ ${G.xp}<small>XP סה״כ</small></div><div class="stat">🃏 6<small>קלפים</small></div></div>
   <div style="background:rgba(255,255,255,.12);border-radius:18px;padding:14px;margin-top:16px;display:flex;gap:12px;align-items:center;text-align:left"><div style="font-size:34px">💎</div><div><div style="font-size:11px;letter-spacing:1.5px;color:#BFD2F2;font-weight:900">זו השאלה של פרק 2: מה הערך של דבר?</div><b>למה כוס מים זולה ויהלום יקר? מה הופך משהו ליקר?</b></div></div></div>
   <div class="foot" style="background:transparent;border:0"><button class="btn gold">חזרה לפרק</button></div>`,'reward');
  setTimeout(()=>confetti(90),900);$('.btn',el).onclick=home;
}
};
function countUp(el,to,ms){const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*k);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function shapes(cls){
  const P=[`<svg class="${cls}" viewBox="0 0 80 120" style="width:80px"><circle cx="40" cy="16" r="11"/><path d="M27 32h26l6 50h-9l-4 38h-12l-4-38h-9z"/><path d="M53 36l18-18 6 6-18 20z"/><path d="M62 4h18v16h-18z" transform="rotate(10 70 12)"/></svg>`,
   `<svg class="${cls} b" viewBox="0 0 140 120" style="width:140px"><path d="M20 60c10-14 40-18 70-14 10-14 24-20 34-16l-6 10c6 4 8 10 6 14l-14-2c-2 10-6 18-12 22l4 44h-10l-6-36c-14 4-30 4-44 0l-6 36H26l2-40c-8-4-12-10-8-18z"/></svg>`,
   `<svg class="${cls} c" viewBox="0 0 70 120" style="width:70px"><path d="M22 10h26l-4 14c12 8 18 24 14 44-4 22-14 36-23 36s-19-14-23-36c-4-20 2-36 14-44z"/></svg>`];
  return P.join('');
}
function embers(){let h='';for(let i=0;i<7;i++)h+=`<i class="ember" style="left:${45+Math.random()*10}%;--dx:${(Math.random()-.5)*60}px;animation-delay:${Math.random()*2.6}s"></i>`;return h}

/* ---------------- flow ---------------- */
let cur=0;
function startDay(i){cur=i;D=DAYS[i];step=0;dayScore=0;dayQ=0;dayXP=0;render()}
function render(){const s=D.steps[step];R[s.k](s)}
function nextStep(){step++;if(step<D.steps.length)render();else home()}
function home(){
  D=null;
  const nodes=DAYS.map((d,i)=>{const done=G.done.has(i),curN=!done&&[...Array(i).keys()].every(j=>G.done.has(j));const L=i%2===0;
   const img=`<img src="${IMG[d.home]}" alt="" class="nimg">`,lab=`<div class="nlab" style="text-align:${L?'right':'left'}"><small>יום ${i+1}${i<6?' · '+d.who.split(' ').pop().toUpperCase():''}</small>${d.t}</div>`;
   return `<div class="node ${done?'done':''} ${curN?'cur':''}">${L?img:lab}<div class="nb">${curN?'<span class="start">התחילו</span>':''}<button class="nbtn" data-d="${i}" aria-label="יום ${i+1}">${done?'✓':i===6?'🏆':i+1}</button></div>${L?lab:img}</div>`}).join('');
  const el=mount(`<div class="hhead"><div class="t"><div class="pillrow"><span class="pill">🔥 ${G.streak}</span><span class="pill">⭐ ${G.xp}</span></div><span class="pill" style="color:var(--p)">🃏 ${Math.min(6,G.done.size)}/6</span></div><div class="sub2" style="margin-top:14px">כלכלה · פרק 1</div><h1>מה זאת בכלל כלכלה?</h1><div class="sub2">שישה הוגים, שבעה דיאלוגים · כל הימים פתוחים באב טיפוס</div></div><div class="main"><div class="path">${nodes}</div></div>`,'home');
  $$('[data-d]',el).forEach(b=>b.onclick=()=>startDay(+b.dataset.d));
  const c=$('.node.cur',el);if(c)setTimeout(()=>c.scrollIntoView({block:'center',behavior:'smooth'}),300);
}
$('#stay').onclick=()=>$('#modal').classList.remove('on');
$('#leave').onclick=()=>{$('#modal').classList.remove('on');home()};
// courage index helper
const _ask=R.ask;R.ask=s=>{if(s.key==='test')A.courageI=A.courageI??1;_ask(s)};
home();
}
</script>
</body>
