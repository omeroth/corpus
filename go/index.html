<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Corpus</title>
<style>
  :root { --ink:#5C1F0C; --accent:#E8853A; --bg:#FFF7ED; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:"Nunito","Helvetica Neue",Arial,sans-serif; padding:24px;
  }
  .wrap { text-align:center; max-width:420px; width:100%; }
  .mark { font-size:32px; font-weight:900; color:var(--accent); margin:0 0 8px; }
  .sub { font-size:17px; font-weight:600; margin:0 0 32px; opacity:.75; }
  .btn {
    display:block; width:100%; padding:16px 20px; margin:12px 0;
    border-radius:999px; text-decoration:none; font-weight:800; font-size:17px;
    background:var(--accent); color:#fff;
  }
  .btn.alt { background:#fff; color:var(--ink); border:2px solid rgba(47,33,80,.15); }
  .note { margin-top:24px; font-size:14px; opacity:.6; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="mark">Corpus</p>
    <p class="sub">Five minutes a day with history's greatest minds.</p>
    <a class="btn" id="ios" href="https://apps.apple.com/us/app/corpus-ideas-worth-knowing/id6781227385">Download on the App Store</a>
    <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.corpusapp.corpus">Get it on Google Play</a>
    <p class="note" id="note">Opening the store&hellip;</p>
  </div>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var target = null;
  if (isIOS) target = document.getElementById("ios").href;
  else if (isAndroid) target = document.getElementById("android").href;
  if (target) {
    window.location.replace(target);
  } else {
    document.getElementById("note").textContent = "Choose your platform above.";
  }
})();
</script>
</body>
</html>
